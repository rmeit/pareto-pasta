[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.96"

[workspace.dependencies]
pasta-linalg = { path = "crates/pasta-linalg" }
pasta-die = { path = "crates/pasta-die" }
pasta-flow = { path = "crates/pasta-flow" }
pasta-shell = { path = "crates/pasta-shell" }
pasta-sim = { path = "crates/pasta-sim" }
faer = { version = "0.24", default-features = false, features = ["std", "rayon"] }
spade = "2.15"
rayon = "1.12"
glam = { version = "0.34", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.12"
arc-swap = "1.9"
clap = { version = "4.6", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = "0.37"
egui_plot = "0.38"
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
png = "0.18"
rfd = "0.18"

[profile.release]
debug = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

# Deliberate in numerical code: index loops over parallel arrays, `!(x > 0)`
# so NaN fails the check, and a few nested tuple types.
[workspace.lints.clippy]
needless_range_loop = "allow"
neg_cmp_op_on_partial_ord = "allow"
type_complexity = "allow"
wrong_self_convention = "allow"
